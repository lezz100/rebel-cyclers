<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0B0B0B"/>
  <!-- Rear wheel -->
  <circle cx="9" cy="22" r="6" stroke="#FF6B00" stroke-width="1.8" fill="none"/>
  <!-- Front wheel -->
  <circle cx="23" cy="22" r="6" stroke="#FF6B00" stroke-width="1.8" fill="none"/>
  <!-- Main frame triangle: seat tube, top tube, down tube -->
  <line x1="15" y1="21" x2="11" y2="12" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="12" x2="20" y2="11" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="21" x2="20" y2="11" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rear triangle: chainstay + seatstay -->
  <line x1="15" y1="21" x2="9" y2="22" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="12" x2="9" y2="22" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="20" y1="11" x2="23" y2="22" stroke="#FF6B00" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Stem + handlebars -->
  <line x1="20" y1="11" x2="20" y2="8" stroke="#FF6B00" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="18" y1="7" x2="22" y2="7" stroke="#FF6B00" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Saddle -->
  <line x1="9" y1="11" x2="13" y2="11" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
</svg>
